<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cortex Dashboard</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    /* Dashboard uses system font stack instead of monospace */
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .container { display: block; }
    .dash-nav { margin-left: 16px; }
  </style>
</head>
<body>
  <header>
    <h1>Cortex Dashboard</h1>
    <div>
      <a href="/" class="dash-nav">Chat</a>
      <a href="/audit.html" class="dash-nav">Audit</a>
    </div>
  </header>

  <div class="container">
    <div class="section">
      <h2>Metrics</h2>
      <div id="metrics-container" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;">
        <div class="empty">Loading...</div>
      </div>
    </div>

    <div class="section">
      <h2>Metacognition Alerts</h2>
      <div id="alerts-container"><div class="empty">No active alerts</div></div>
    </div>

    <div class="section">
      <h2>Memory Browser <span id="memory-count"></span></h2>
      <div class="controls">
        <input type="text" id="search" placeholder="Search memories..." style="flex:1;min-width:200px;">
        <select id="type-filter">
          <option value="">All Types</option>
          <option value="Feedback">Feedback</option>
          <option value="Project">Project</option>
          <option value="User">User</option>
          <option value="Reference">Reference</option>
        </select>
        <select id="status-filter">
          <option value="">All Status</option>
          <option value="Captured">Captured</option>
          <option value="Materialized">Materialized</option>
          <option value="Stabilized">Stabilized</option>
          <option value="Deprecated">Deprecated</option>
        </select>
      </div>
      <table>
        <thead><tr><th>Type</th><th>Status</th><th>Description</th><th>Content</th><th>Created</th></tr></thead>
        <tbody id="memory-table"></tbody>
      </table>
    </div>
  </div>

  <script>
    let allMemories = [];

    function safeClassToken(value) {
      return String(value || 'unknown')
        .toLowerCase()
        .replace(/[^a-z0-9_-]+/g, '-')
        .replace(/^-|-$/g, '') || 'unknown';
    }

    function emptyState(text) {
      const el = document.createElement('div');
      el.className = 'empty';
      el.textContent = text;
      return el;
    }

    function textCell(text) {
      const td = document.createElement('td');
      td.textContent = text || '';
      return td;
    }

    function badgeCell(label, prefix) {
      const td = document.createElement('td');
      const badge = document.createElement('span');
      badge.className = `badge ${prefix}-${safeClassToken(label)}`;
      badge.textContent = label;
      td.appendChild(badge);
      return td;
    }

    async function loadMemories() {
      try {
        const resp = await fetch('/api/memory');
        if (!resp.ok) return;
        allMemories = await resp.json();
        renderMemories();
      } catch (e) { console.error('Failed to load memories:', e); }
    }

    function renderMemories() {
      const search = document.getElementById('search').value.toLowerCase();
      const typeF = document.getElementById('type-filter').value;
      const statusF = document.getElementById('status-filter').value;

      const filtered = allMemories.filter(m => {
        if (typeF && formatType(m.memory_type) !== typeF) return false;
        if (statusF && formatStatus(m.status) !== statusF) return false;
        if (search) {
          const text = `${m.description || ''} ${m.content || ''}`.toLowerCase();
          if (!text.includes(search)) return false;
        }
        return true;
      });

      document.getElementById('memory-count').textContent = `(${filtered.length}/${allMemories.length})`;

      const tbody = document.getElementById('memory-table');
      tbody.replaceChildren();
      if (filtered.length === 0) {
        const row = document.createElement('tr');
        const cell = textCell('No memories match filters');
        cell.colSpan = 5;
        cell.className = 'empty';
        row.appendChild(cell);
        tbody.appendChild(row);
        return;
      }

      for (const memory of filtered) {
        const row = document.createElement('tr');
        row.appendChild(badgeCell(formatType(memory.memory_type), 'badge'));
        row.appendChild(badgeCell(formatStatus(memory.status), 'badge'));
        row.appendChild(textCell(memory.description));
        row.appendChild(textCell(truncate(memory.content, 80)));
        const created = textCell(formatDate(memory.created_at));
        created.style.color = 'var(--text-dim)';
        created.style.whiteSpace = 'nowrap';
        row.appendChild(created);
        tbody.appendChild(row);
      }
    }

    function formatType(t) {
      if (typeof t === 'string') return t;
      return Object.keys(t || {})[0] || 'Unknown';
    }

    function formatStatus(s) {
      if (typeof s === 'string') return s;
      return Object.keys(s || {})[0] || 'Unknown';
    }

    function formatDate(d) {
      if (!d) return '';
      return new Date(d).toLocaleDateString();
    }

    function truncate(s, n) { return s && s.length > n ? s.slice(0, n) + '...' : (s || ''); }

    async function loadAlerts() {
      try {
        const resp = await fetch('/api/meta/alerts');
        if (!resp.ok) return;
        const data = await resp.json();
        const container = document.getElementById('alerts-container');
        container.replaceChildren();
        if (!data.alerts || data.alerts.length === 0) {
          container.appendChild(emptyState('No active alerts'));
          return;
        }
        for (const alert of data.alerts) {
          const item = document.createElement('div');
          item.className = 'alert-item';
          item.appendChild(document.createTextNode(alert.alert || ''));
          const session = document.createElement('div');
          session.className = 'session';
          session.textContent = `Session: ${alert.session_id || ''} - Turn ${alert.turn_count || 0}`;
          item.appendChild(session);
          container.appendChild(item);
        }
      } catch (e) { console.error('Failed to load alerts:', e); }
    }

    document.getElementById('search').addEventListener('input', renderMemories);
    document.getElementById('type-filter').addEventListener('change', renderMemories);
    document.getElementById('status-filter').addEventListener('change', renderMemories);

    async function loadMetrics() {
      try {
        const resp = await fetch('/api/metrics/structured');
        if (!resp.ok) return;
        const data = await resp.json();
        const container = document.getElementById('metrics-container');
        container.replaceChildren();
        let count = 0;
        for (const [key, value] of Object.entries(data)) {
          if (typeof value !== 'number' && typeof value !== 'string') continue;
          const card = document.createElement('div');
          card.style.background = 'var(--assistant-bg)';
          card.style.padding = '12px 16px';
          card.style.borderRadius = '6px';
          const label = document.createElement('div');
          label.style.color = 'var(--text-dim)';
          label.style.fontSize = '11px';
          label.style.textTransform = 'uppercase';
          label.textContent = key.replace(/_/g, ' ');
          const metric = document.createElement('div');
          metric.style.color = 'var(--text)';
          metric.style.fontSize = '20px';
          metric.style.fontWeight = '600';
          metric.style.marginTop = '4px';
          metric.textContent = typeof value === 'number' ? value.toFixed(2) : String(value);
          card.append(label, metric);
          container.appendChild(card);
          count += 1;
        }
        if (count === 0) container.appendChild(emptyState('No metrics'));
      } catch (e) { console.error('Metrics:', e); }
    }

    loadMetrics();
    loadMemories();
    loadAlerts();
    setInterval(loadMetrics, 15000);
    setInterval(loadAlerts, 10000);
    setInterval(loadMemories, 30000);
  </script>
</body>
</html>
