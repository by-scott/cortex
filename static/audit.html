<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cortex — Audit Dashboard</title>
<link rel="stylesheet" href="/style.css">
<style>
  /* Audit-specific: card h2 uppercase treatment */
  .card h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
  /* Use surface-alt for card backgrounds */
  .card { background: var(--surface-alt); }
  .stat { background: var(--surface); }
</style>
</head>
<body>
<div class="header">
  <h1>Audit Dashboard</h1>
  <a href="/">&larr; Back to Chat</a>
</div>
<div class="container" style="display:grid;gap:20px;">
  <!-- Health Overview -->
  <div class="card" id="health-card">
    <h2>Health Overview</h2>
    <div class="health-gauge"><div class="score" id="health-score">--</div><div class="label">Overall Health</div></div>
    <div class="stat-row" id="health-stats"></div>
  </div>

  <!-- Event Distribution -->
  <div class="card" id="events-card">
    <h2>Event Distribution</h2>
    <div class="stat-row" id="summary-stats"></div>
    <div id="event-bars"></div>
  </div>

  <!-- Decision Path Explorer -->
  <div class="card">
    <h2>Decision Path Explorer</h2>
    <div class="search-row">
      <input type="text" id="corr-input" placeholder="Enter correlation_id...">
      <button onclick="fetchPath()">Search</button>
    </div>
    <div id="path-timeline"></div>
  </div>
</div>

<script>
function emptyState(text) {
  const el = document.createElement('div');
  el.className = 'empty';
  el.textContent = text;
  return el;
}

function stat(labelText, valueText) {
  const el = document.createElement('div');
  el.className = 'stat';
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = labelText;
  const value = document.createElement('div');
  value.className = 'value';
  value.textContent = valueText;
  el.append(label, value);
  return el;
}

function confidenceColor(value) {
  if (value >= 0.7) return 'var(--green)';
  if (value >= 0.4) return 'var(--yellow)';
  return 'var(--red)';
}

async function fetchSummary() {
  const bars = document.getElementById('event-bars');
  try {
    const r = await fetch('/api/audit/summary');
    const d = await r.json();
    document.getElementById('summary-stats').replaceChildren(
      stat('Total Events', d.total_events),
      stat('Turns', d.turn_count),
      stat('Tool Calls', d.tool_call_count),
      stat('Avg Confidence', (d.avg_confidence || 0).toFixed(2)),
    );
    const counts = Object.entries(d.event_type_counts || {}).sort((a, b) => b[1] - a[1]);
    const max = counts.length ? counts[0][1] : 1;
    bars.replaceChildren();
    for (const [name, count] of counts) {
      const row = document.createElement('div');
      row.className = 'bar-row';
      const barName = document.createElement('div');
      barName.className = 'bar-name';
      barName.textContent = name;
      const track = document.createElement('div');
      track.className = 'bar-track';
      const fill = document.createElement('div');
      fill.className = 'bar-fill';
      fill.style.width = `${(count / max * 100).toFixed(1)}%`;
      track.appendChild(fill);
      const barCount = document.createElement('div');
      barCount.className = 'bar-count';
      barCount.textContent = count;
      row.append(barName, track, barCount);
      bars.appendChild(row);
    }
  } catch(e) { bars.replaceChildren(emptyState('Failed to load')); }
}

async function fetchHealth() {
  try {
    const r = await fetch('/api/audit/health');
    const d = await r.json();
    const s = d.overall_health || 0;
    const score = document.getElementById('health-score');
    score.style.color = confidenceColor(s);
    score.textContent = `${(s * 100).toFixed(0)}%`;
    document.getElementById('health-stats').replaceChildren(
      stat('Turns', d.turn_count),
      stat('Events', d.total_events),
      stat('Meta Alerts', d.meta_alert_count),
      stat('Confidence', (d.avg_confidence || 0).toFixed(2)),
    );
  } catch(e) { document.getElementById('health-score').textContent = 'N/A'; }
}

async function fetchPath() {
  const id = document.getElementById('corr-input').value.trim();
  if (!id) return;
  const target = document.getElementById('path-timeline');
  try {
    const r = await fetch(`/api/audit/decision-path/${encodeURIComponent(id)}`);
    const d = await r.json();
    target.replaceChildren();
    if (!d.steps || !d.steps.length) {
      target.appendChild(emptyState('No steps found for this correlation ID'));
      return;
    }
    const timeline = document.createElement('div');
    timeline.className = 'timeline';
    for (const stepData of d.steps) {
      const step = document.createElement('div');
      step.className = 'step';
      const ts = document.createElement('div');
      ts.className = 'ts';
      ts.textContent = new Date(stepData.timestamp).toLocaleString();
      const type = document.createElement('div');
      type.className = 'type';
      type.textContent = stepData.event_type || '';
      const desc = document.createElement('div');
      desc.className = 'desc';
      desc.textContent = stepData.description || '';
      step.append(ts, type, desc);
      if (stepData.confidence != null) {
        const conf = document.createElement('span');
        conf.className = 'conf';
        conf.style.background = confidenceColor(stepData.confidence);
        conf.style.color = 'var(--bg)';
        conf.textContent = `${(stepData.confidence * 100).toFixed(0)}%`;
        step.appendChild(conf);
      }
      timeline.appendChild(step);
    }
    target.appendChild(timeline);
  } catch(e) { target.replaceChildren(emptyState('Failed to load')); }
}

fetchSummary();
fetchHealth();
</script>
</body>
</html>
