[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.6.15"
edition = "2024"
license = "MIT"
repository = "https://github.com/by-scott/cortex"

[workspace.dependencies]
# Internal crates
cortex-types = { path = "crates/cortex-types" }
cortex-kernel = { path = "crates/cortex-kernel" }
cortex-sdk = { path = "crates/cortex-sdk" }
cortex-turn = { path = "crates/cortex-turn" }
cortex-runtime = { path = "crates/cortex-runtime" }

# Async
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
async-trait = "0.1"
futures-util = "0.3"
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
toml = "0.8"
toml_edit = "0.22"
serde_norway = "0.9"

# Identity & time
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "json", "multipart", "rustls-tls", "stream"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
rust-embed = "8"
socket2 = "0.6"
mime_guess = "2"
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }

# TLS
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"

# Database
rusqlite = { version = "0.35", features = ["bundled"] }
sqlite-vec = "0.1"

# Parsing
regex = "1"
pulldown-cmark = "0.13"

# Security
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
jsonwebtoken = "9"
libc = "0.2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
qrcode = { version = "0.14", default-features = false }

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
notify = "7"
libloading = "0.8"
flate2 = "1"
tar = "0.4"
rustyline = "15"
tempfile = "3"
