# Strict local review profile for high-caution work.
# Copy selected sections into ~/.cortex/<instance>/config.toml, then run:
#   cortex doctor --json
#   cortex policy lint
#
# This narrows policy review posture. It is not OS/container sandboxing.

[plugins]
enabled = []

[tools]
disabled = [
  "send_media",
  "web_fetch",
  "web_search",
]

[memory]
auto_extract = false

[risk]
auto_approve_up_to = "Allow"
allow = [
  "audit",
  "memory_graph",
  "memory_search",
  "prompt_inspect",
  "read",
]
deny = [
  "agent",
  "bash",
  "cron",
  "credential_*",
  "deploy_*",
  "edit",
  "mcp_*",
  "memory_save",
  "payment_*",
  "publish_*",
  "send_media",
  "web_*",
  "write",
]

[risk.tools.memory_save]
block = true

[risk.tools.bash]
block = true

[risk.tools.write]
block = true

[risk.tools.edit]
block = true
