# Local OpenAI-compatible vLLM profile for private coding or research.
# Also add a matching [local-vllm] entry to ~/.cortex/providers.toml.
# See docs/local-models.md for provider examples.
#
# Copy selected sections into ~/.cortex/<instance>/config.toml, then run:
#   cortex doctor --json
#   cortex policy lint

[api]
provider = "local-vllm"
model = "Qwen/Qwen2.5-Coder-7B-Instruct"
max_tokens = 8192

[embedding]
provider = "ollama"
model = "nomic-embed-text"

[plugins]
enabled = []

[tools]
disabled = [
  "send_media",
  "web_fetch",
  "web_search",
]

[memory]
auto_extract = false

[risk]
auto_approve_up_to = "Review"
allow = [
  "bash",
  "edit",
  "memory_search",
  "read",
  "write",
]
deny = [
  "credential_*",
  "deploy_*",
  "payment_*",
  "publish_*",
  "send_media",
]

[risk.tools.bash]
require_confirmation = true
tool_risk = 0.8
file_sensitivity = 0.4
blast_radius = 0.5
irreversibility = 0.4

[risk.tools.write]
require_confirmation = true
tool_risk = 0.5
file_sensitivity = 0.4
blast_radius = 0.4
irreversibility = 0.3

[risk.tools.edit]
require_confirmation = true
tool_risk = 0.5
file_sensitivity = 0.4
blast_radius = 0.4
irreversibility = 0.3
