# Personal trusted local workstation profile.
# Copy selected sections into ~/.cortex/<instance>/config.toml, then run:
#   cortex doctor --json
#   cortex policy lint
#
# Policy/risk gates are review controls, not sandbox containment.

[plugins]
enabled = []

[risk]
auto_approve_up_to = "Review"
allow = []
deny = [
  "credential_*",
  "deploy_*",
  "payment_*",
  "publish_*",
]

[risk.tools.bash]
require_confirmation = true
tool_risk = 0.8
blast_radius = 0.5
irreversibility = 0.4

[risk.tools.write]
require_confirmation = true
tool_risk = 0.5
blast_radius = 0.4
irreversibility = 0.3

[risk.tools.edit]
require_confirmation = true
tool_risk = 0.5
blast_radius = 0.4
irreversibility = 0.3
